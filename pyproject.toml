[project]
name = "offlinedemo"
version = "0.5.0"
description = "Easy demonstration of models by offlineisbetter."
readme = "README.md"
authors = [
    { name = "offlineisbetter", email = "dev@offlineisbetter.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "tokenizers>=0.23.2",
]

[project.scripts]
offlinedemo = "offlinedemo:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
